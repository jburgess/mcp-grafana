name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing to npm

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Skip if this version is already on npm
        # Idempotency guard: lets a tag for an already-published version
        # (e.g. a bootstrap version published by hand before trusted
        # publishing was configured) run without failing on "cannot
        # publish over existing version". `npm view pkg@ver version`
        # prints the version when it exists and nothing otherwise.
        id: published
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version 2>/dev/null | grep -q .; then
            echo "Already published: $PKG@$VER — skipping publish step."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not yet published: $PKG@$VER — will publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with provenance
        # OIDC trusted publishing — npm exchanges the GitHub-issued
        # id-token for a short-lived publish credential. Requires the
        # package's trusted publisher to be configured on npmjs.com.
        if: steps.published.outputs.skip == 'false'
        run: npm publish --provenance --access public
